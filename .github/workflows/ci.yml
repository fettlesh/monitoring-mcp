name: CI

# Runs on every push and pull request. The contract drift check is deliberately
# NOT here: it talks to production, so a network hiccup or a deploy in flight
# would fail an unrelated pull request. It gates the release instead
# (publish.yml), which is the moment the vendored copy actually becomes a
# promise to users.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  checks:
    name: format · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 20 is the `engines` floor; publish.yml builds on the same version.
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Smoke — the built binary explains a missing key and exits non-zero
        run: |
          set +e
          output=$(node dist/index.js 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          echo "$output" | grep -q "FETTLE_API_KEY is not set" \
            || { echo "expected the missing-key message"; exit 1; }
