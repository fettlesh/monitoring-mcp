name: Publish

# Releases on a version tag: `npm version patch && git push --follow-tags`.
#
# Three jobs, each holding only what it needs:
#
#   build    — installs dependencies, runs the checks and packs the tarball.
#              Runs third-party code, so it holds no credentials at all.
#   publish  — publishes that tarball to npm. Holds the OIDC token (npm trusted
#              publishing: the package on npmjs.com trusts this file and the
#              `npm-publish` environment, so no token is stored here; the same
#              token signs the provenance statement). Runs no repository code.
#   registry — publishes server.json to the MCP registry. Holds the DNS signing
#              key of the `sh.fettle` namespace (`registry-publish` environment
#              secret). Runs only the pinned, checksum-verified mcp-publisher.
#
# A compromised dependency in `build` can still alter the tarball it hands
# over; the environments' required reviewer and npm provenance are the
# controls for that. Every action is pinned by commit SHA.
#
# Re-running is safe: `publish` skips a version already on npm and `registry`
# skips a version already in the registry, so "Re-run all jobs" after a failed
# registry job does not fail on npm's "cannot publish over".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build · verify · pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        # No dependency cache on a release: a cache entry written by another
        # workflow run could otherwise feed what gets packed and published.
        # Node 20 is the `engines` floor, the same version ci.yml tests.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Contract matches production
        # A release is exactly when a stale vendored contract stops being a
        # local detail and becomes what users install, so the check gates here
        # rather than on every pull request.
        run: pnpm run contract:check

      - name: Tag matches package version
        id: version
        # Publishing 0.1.0 from a tag reading v0.2.0 produces a version nobody
        # can find and a tag nobody can trust. Cheaper to catch here than to
        # deprecate afterwards.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" \
            || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        # The build above is what ships: `publish` uploads this tarball with
        # lifecycle scripts disabled, so nothing is rebuilt there.
        run: npm pack --ignore-scripts

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: fettle-mcp-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm
        # Trusted publishing needs npm 11.5.1 or newer; pinned exactly rather
        # than whatever the runner's Node ships.
        run: npm install -g npm@11.21.1

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish
        # The version comes from the tag itself; the build job's output must
        # agree with it, so a tampered output cannot pick another tarball.
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          VERSION="${VERSION#v}"
          test "$VERSION" = "$BUILD_VERSION" \
            || { echo "tag version $VERSION does not match build output $BUILD_VERSION"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag version $VERSION is not a semver version"; exit 1; }
          if npm view "fettle-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "fettle-mcp@$VERSION already on npm, skipping"
          else
            npm publish "./fettle-mcp-$VERSION.tgz" --provenance --access public --ignore-scripts
          fi

  registry:
    name: publish to the MCP registry
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: registry-publish
    permissions:
      contents: read
    env:
      PUBLISHER_VERSION: 1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz from the v1.8.1 release.
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

    steps:
      - name: Checkout server.json
        # Only the registry entry, nothing that could run.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: server.json
          sparse-checkout-cone-mode: false

      - name: Check version
        id: check
        # The version comes from the tag and must agree with the build job's
        # output. The registry verifies the npm package, so server.json must
        # name the version just published there. A version already in the
        # registry is left alone: entries are immutable, and a rerun must pass.
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          VERSION="${VERSION#v}"
          test "$VERSION" = "$BUILD_VERSION" \
            || { echo "tag version $VERSION does not match build output $BUILD_VERSION"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "tag version $VERSION is not a semver version"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          test "$(jq -r .version server.json)" = "$VERSION" \
            && test "$(jq -r '.packages[0].version' server.json)" = "$VERSION" \
            || { echo "server.json does not name version $VERSION"; exit 1; }
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/sh.fettle%2Fmcp/versions/$VERSION")
          case "$status" in
            200) echo "sh.fettle/mcp $VERSION already in the registry, skipping"
                 echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "registry answered HTTP $status"; exit 1 ;;
          esac

      - name: Download mcp-publisher
        if: steps.check.outputs.exists == 'false'
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/$archive"
          echo "$PUBLISHER_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" mcp-publisher
          rm -f "$archive"

      - name: Wait for npm
        if: steps.check.outputs.exists == 'false'
        # The registry checks `mcpName` by fetching exactly this URL, and npm's
        # CDN can keep answering "version not found" for 10+ minutes after a
        # successful publish. Publishing before it answers fails the job.
        run: |
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/fettle-mcp/$VERSION" && exit 0
            sleep 10
          done
          echo "fettle-mcp@$VERSION is not on npm"; exit 1

      - name: Log in
        if: steps.check.outputs.exists == 'false'
        # mcp-publisher 1.8.1 takes the key only as a flag (no file or stdin
        # option), so it is briefly visible to this ephemeral runner's process
        # list; the secret is masked in logs and never echoed.
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set +x
          ./mcp-publisher login dns --domain fettle.sh --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish
        if: steps.check.outputs.exists == 'false'
        run: ./mcp-publisher publish

      - name: Log out
        if: always()
        # 1.8.1 keeps the registry token in ~/.config/mcp-publisher/token.json;
        # ~/.mcp_publisher_token is where older versions kept it.
        run: |
          ./mcp-publisher logout || true
          rm -f "$HOME/.config/mcp-publisher/token.json" "$HOME/.mcp_publisher_token" mcp-publisher
